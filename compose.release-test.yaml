name: healthscope-release-test

# CI-only overlay for exercising the production container contract. The database
# is ephemeral and intentionally contains no healthcare records.
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: healthscope_release_test
      POSTGRES_USER: healthscope_release_test
      POSTGRES_PASSWORD: healthscope-release-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthscope_release_test -d healthscope_release_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    environment:
      HEALTHSCOPE_DATABASE_URL: ${HEALTHSCOPE_RELEASE_TEST_DATABASE_URL:-postgresql+psycopg://healthscope_release_test:healthscope-release-test-only@database:5432/healthscope_release_test}
    depends_on:
      database:
        condition: service_healthy

  api:
    environment:
      HEALTHSCOPE_DATABASE_URL: ${HEALTHSCOPE_RELEASE_TEST_DATABASE_URL:-postgresql+psycopg://healthscope_release_test:healthscope-release-test-only@database:5432/healthscope_release_test}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ingest:
    environment:
      HEALTHSCOPE_DATABASE_URL: ${HEALTHSCOPE_RELEASE_TEST_DATABASE_URL:-postgresql+psycopg://healthscope_release_test:healthscope-release-test-only@database:5432/healthscope_release_test}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
