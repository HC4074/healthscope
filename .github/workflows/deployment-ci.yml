name: Deployment CI

on:
  pull_request:
    paths:
      - "compose.production.yaml"
      - "compose.release-test.yaml"
      - ".env.production.example"
      - "backend/**"
      - "frontend/**"
      - "scripts/test-production-release.sh"
      - "docs/deployment.md"
      - ".github/workflows/deployment-ci.yml"
  push:
    branches: [main]
    paths:
      - "compose.production.yaml"
      - "compose.release-test.yaml"
      - ".env.production.example"
      - "backend/**"
      - "frontend/**"
      - "scripts/test-production-release.sh"
      - "docs/deployment.md"
      - ".github/workflows/deployment-ci.yml"

permissions:
  contents: read

jobs:
  containers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate production configuration
        run: |
          cp .env.production.example .env.production
          docker compose -f compose.production.yaml config --quiet

      - name: Build production images
        run: docker compose -f compose.production.yaml build

      - name: Exercise production release contract
        run: bash scripts/test-production-release.sh

  publish:
    if: github.event_name == 'push'
    needs: containers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./backend
            description: HealthScope FastAPI service and CMS ingestion worker
          - image: frontend
            context: ./frontend
            description: HealthScope Nginx-served React dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: type=raw,value=sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=HealthScope ${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build and push commit image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
          sbom: false

      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/healthscope-${{ matrix.image }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SPDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/healthscope-${{ matrix.image }}.spdx.json
          push-to-registry: true
          create-storage-record: false
