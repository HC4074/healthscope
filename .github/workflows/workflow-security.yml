name: Workflow Security

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/check_workflow_action_pins.py"
      - "scripts/test_check_workflow_action_pins.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/check_workflow_action_pins.py"
      - "scripts/test_check_workflow_action_pins.py"

permissions:
  contents: read

jobs:
  immutable-actions:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject mutable external action references
        run: |
          python -m unittest scripts/test_check_workflow_action_pins.py
          python scripts/check_workflow_action_pins.py
